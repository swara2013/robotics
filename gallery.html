<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gallery — All About Me</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
    .gallery-item{border:1px solid #f2f2f2;padding:8px;border-radius:8px;background:#fff}
    .gallery-item img{width:100%;height:160px;object-fit:cover;border-radius:6px}

</head>
<body>
  <header class="site-header">
    <div class="container nav-row">
      <a class="brand" href="index.html">[Your Name]</a>
      <nav class="main-nav">
        <a href="about.html">About</a>
        <a href="gallery.html">Gallery</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Gallery</h1>
    <p>Replace these placeholders with your photos or artwork (optimized).</p>
    <div class="gallery-grid">
      <div class="gallery-item"><img src="assets/profile.svg" alt="Profile placeholder"></div>
      <div class="gallery-item"><img src="assets/hobby-veena.svg" alt="Veena placeholder"></div>
      <div class="gallery-item"><img src="assets/hobby-percussion.svg" alt="Percussion placeholder"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> [Your Name]</p>
    </div>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
